version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    volumes:
      - ./frontend/:/usr/src/app
      - /usr/src/app/node_modules
    container_name: shopping-list-front-dev
    ports:
      - "3000:3000"
    stdin_open: true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

